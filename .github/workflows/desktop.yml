name: Build Slide Cloud Windows alpha
on: workflow_dispatch
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml -j 1 --locked
      - run: npm run tauri -- build --bundles nsis
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: slide-cloud-Windows-unsigned-alpha
          path: |
            releases/windows/*.zip
            releases/windows/*.exe
            docs/BUILD_ARTIFACTS.json
